name: Build Binary

on:
  workflow_call:
    inputs:
      goos:
        required: true
        type: string
      goarch:
        required: true
        type: string
      runner:
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Build binary
        env:
          GOOS: ${{ inputs.goos }}
          GOARCH: ${{ inputs.goarch }}
        run: |
          EXTENSION=""
          if [ "${{ inputs.goos }}" = "windows" ]; then
            EXTENSION=".exe"
          fi
          go build -ldflags "-X whatsmeow-go/cmd/wavy/common.Version=$VERSION" -o "bin/wavy-${{ inputs.goos }}-${{ inputs.goarch }}${EXTENSION}" ./cmd/wavy

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wavy-${{ inputs.goos }}-${{ inputs.goarch }}
          path: bin/wavy-${{ inputs.goos }}-${{ inputs.goarch }}*